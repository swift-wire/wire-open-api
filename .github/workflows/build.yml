name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# wire-open-api is swift-tools-version 6.4 and macOS 26 since M6d.1: `WireOpenAPIMVC` mounts OpenAPI
# operations as WireMVC routes, and wire-mvc is proposal-native. It therefore builds only on a Swift 6.4
# toolchain — the jobs run on the nightly 6.4 container, since SwiftyLab/setup-swift installs released
# toolchains only. swift-syntax is pinned to its release/6.4.x branch (SPM version ranges don't resolve
# pre-release tags; the branch pin also overrides swift-wire's transitive 603 requirement).
jobs:
  BuildAndTest:
    name: Swift 6.4 (pinned)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Read the pinned toolchain
        # `.swift-version` is the single source of truth: local `swiftly` and CI resolve the same snapshot.
        # Bump the file, not the workflow.
        run: echo "SWIFT_SNAPSHOT=$(cat .swift-version)" >> "$GITHUB_ENV"
      - name: Install system dependencies
        # libcurl4-openssl-dev is required by the toolchain itself (Foundation networking on Linux) and must
        # precede the install, or Swiftly's post-install check fails.
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libsqlite3-dev libcurl4-openssl-dev curl
      - name: Install Swiftly + the pinned toolchain
        run: |
          curl -L "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz" | tar zxf -
          ./swiftly init --assume-yes --skip-install
          echo "$HOME/.local/share/swiftly/bin" >> "$GITHUB_PATH"
          # No `--use`: every command runs through `swiftly run`, which reads `.swift-version` itself.
          # `--use` would rewrite that file (dropping its trailing newline) and dirty the tree, which the
          # swift-format job's `git diff --exit-code` guard then fails on.
          "$HOME/.local/share/swiftly/bin/swiftly" install "$SWIFT_SNAPSHOT" --assume-yes
      - name: Build
        run: swiftly run swift build
      - name: Test
        run: swiftly run swift test
  Fixtures:
    name: Fixtures — serve and probe
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Read the pinned toolchain
        # `.swift-version` is the single source of truth: local `swiftly` and CI resolve the same snapshot.
        # Bump the file, not the workflow.
        run: echo "SWIFT_SNAPSHOT=$(cat .swift-version)" >> "$GITHUB_ENV"
      - name: Install system dependencies
        # libcurl4-openssl-dev is required by the toolchain itself (Foundation networking on Linux) and must
        # precede the install, or Swiftly's post-install check fails.
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libsqlite3-dev libcurl4-openssl-dev curl
      - name: Install Swiftly + the pinned toolchain
        run: |
          curl -L "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz" | tar zxf -
          ./swiftly init --assume-yes --skip-install
          echo "$HOME/.local/share/swiftly/bin" >> "$GITHUB_PATH"
          # No `--use`: every command runs through `swiftly run`, which reads `.swift-version` itself.
          # `--use` would rewrite that file (dropping its trailing newline) and dirty the tree, which the
          # swift-format job's `git diff --exit-code` guard then fails on.
          "$HOME/.local/share/swiftly/bin/swiftly" install "$SWIFT_SNAPSHOT" --assume-yes
      - name: Build
        working-directory: Fixtures
        run: swiftly run swift build
      - name: Check the naming golden table against the real generator
        # Sources/WireOpenAPINaming transcribes swift-openapi-generator's internal SafeNameGenerator,
        # which the typed shim needs to name generated symbols. A copy does not fail when it is wrong
        # today; it fails when the original changes and ours does not, and the symptom is "cannot find
        # type" inside generated code. So this runs the *real* generator over the corpus and diffs the
        # names it emitted against the checked-in table. The unit tests hold the copy to that table.
        #
        # It runs in this job because this is where swift-openapi-generator is already resolved.
        env:
          OPENAPI_GENERATOR_PATH: ${{ github.workspace }}/Fixtures/.build/checkouts/swift-openapi-generator
        run: swiftly run swift run NamingGoldenTool --check

      - name: Check the diagnostics WireOpenAPIGen rejects with
        # The fixture proves only what *builds*, so every reject path was unguarded — and a diagnostic
        # that quietly stops firing does not fail anything, it moves the failure into generated code at a
        # line nobody wrote. This runs WireOpenAPIGen over a corpus of documents and controllers that must
        # be refused, and diffs its exit code and stderr against the checked-in table. Wording is held
        # too: a diagnostic that still fires but has lost its advice is a regression as well.
        #
        # `swift build` first so the binary sits beside the tool — it locates one rather than nesting
        # `swift run`, which would have both invocations contend for this package's build lock.
        run: |
          swiftly run swift build --product WireOpenAPIGen
          swiftly run swift run DiagnosticGoldenTool --check

      - name: Serve an OpenAPI operation and a @Get route from one router
        working-directory: Fixtures
        # The M6d.1 gate. Four plugins run over one target — swift-openapi-generator, WireGen,
        # WireMVCRouteGen, WireOpenAPIGen — and every controller collates into
        # WireMVCKeys.routeContributors, so the generated @main serves them from a single router.
        #
        # The spec-driven half is split across two controllers: TaskController (request-scoped, getTask)
        # and TaskListController (app-scoped, listTasks). One document, two objects, two scopes.
        #
        # And a *second* document, OrdersAPI, generated public into its own module and mounted from here.
        # Both modules spell their generated types `APIProtocol`/`Operations`/`Servers` identically, so
        # this is also the check that the emitted namespaces keep them apart.
        #
        # That document is served by two controllers in *two modules*: OrderController beside it, and
        # OrderSummaryController here in the app — the arrangement `spec:` exists for, since where a
        # controller is declared says nothing about which document it implements.
        run: |
          BIN="$(swift build --show-bin-path)/WireOpenAPIBootstrapExample"
          # The fixture line-buffers its own stdout, so the log survives being killed mid-probe.
          "$BIN" > serverlog.txt 2>&1 &
          pid=$!
          ok=0
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/status/tasks -o /dev/null; then ok=1; break; fi
            sleep 1
          done
          # The spec-driven operation, under the prefix its `servers:` block declares. Registering at
          # `/tasks/{id}` instead would mean the generated witness dropped the serverURL — the bug the
          # fixture caught, since registerHandlers' own default is "/" and not the document's server.
          openapi=$(curl -s -w ' [%{http_code}]' http://127.0.0.1:8080/api/v1/tasks/42)
          # The annotation-driven route, from the same router.
          mvc=$(curl -s -w ' [%{http_code}]' http://127.0.0.1:8080/status/tasks)
          # A *global* @Middleware contributes `x-served-by`. It has to appear on both kinds of route:
          # an @Operation builds its own head inside WireOpenAPIRoutes.invoke, so it picks contributions
          # up through a wrapping sender rather than the drain a @Get route's terminal does. Asserting
          # only one kind would let the other regress silently, which is exactly how this was missed.
          openapiServedBy=$(curl -s -D - -o /dev/null http://127.0.0.1:8080/api/v1/tasks/42 \
            | tr -d '\r' | awk 'tolower($1)=="x-served-by:"{print $2}')
          mvcServedBy=$(curl -s -D - -o /dev/null http://127.0.0.1:8080/status/tasks \
            | tr -d '\r' | awk 'tolower($1)=="x-served-by:"{print $2}')
          # An unmatched path reaches the @NotFound fallback, which proves the operations are *inside*
          # the router rather than mounted beside it.
          notfound=$(curl -s -w ' [%{http_code}]' http://127.0.0.1:8080/nope)
          # Unprefixed: must NOT be registered.
          unprefixed=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/tasks/42)
          # A second operation, carrying route-scope @Middleware.
          list=$(curl -s -w ' [%{http_code}]' http://127.0.0.1:8080/api/v1/tasks)
          # The same operation at a different path. `TaskController` is @Scoped(seed: HTTPRequest.self),
          # so its response embeds the path of the request that built it — two requests carrying each
          # other's path would mean one subject was shared.
          other=$(curl -s -w ' [%{http_code}]' http://127.0.0.1:8080/api/v1/tasks/99)
          # The second document, under its own `servers:` prefix, from its own module.
          order=$(curl -s -w ' [%{http_code}]' http://127.0.0.1:8080/api/v2/orders/7)
          order2=$(curl -s -w ' [%{http_code}]' http://127.0.0.1:8080/api/v2/orders/9)
          # One document's prefix must not serve the other's operation.
          crossed=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/orders/7)
          # The half of the Orders document implemented in *this* target, naming its types qualified
          # because the bare spelling here means this target's own document.
          summary=$(curl -s -w ' [%{http_code}]' http://127.0.0.1:8080/api/v2/orders)
          crossed2=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v2/tasks)
          # The typed shim: parameters bound from all three locations, no generated Input in the handler.
          epoch=$(curl -s -w ' [%{http_code}]' http://127.0.0.1:8080/epoch/tasks)
          typed=$(curl -s -H 'X-Request-Id: abc123' \
            "http://127.0.0.1:8080/api/v1/tasks/9/summary?include-done=true" -w ' [%{http_code}]')
          typedBare=$(curl -s -w ' [%{http_code}]' http://127.0.0.1:8080/api/v1/tasks/9/summary)
          # @ErrorResponse on an OpenAPI operation. `missing` is mapped at both scopes and route scope
          # must win; `secret` is mapped only at controller scope, to a status the document does not
          # declare, which becomes `.undocumented(statusCode:)`.
          mappedDocumented=$(curl -s -w ' [%{http_code}]' \
            http://127.0.0.1:8080/api/v1/tasks/missing/summary)
          mappedUndocumented=$(curl -s -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:8080/api/v1/tasks/secret/summary)
          # The same error type, on an operation that does *not* map it itself, so the controller's
          # mapping answers — 500 where summariseTask's own answers 404.
          mappedController=$(curl -s -o /dev/null -X POST -w '%{http_code}' \
            http://127.0.0.1:8080/api/v1/tasks/missing/delete)
          # Mapped at the terminal, not in the forwarder: a body the deserializer rejected never reached
          # the handler, so only a DecodingError mapping out there can claim it. 422 rather than the
          # runtime's own 400 is the evidence it did.
          mappedDecode=$(curl -s -o /dev/null -X POST -H 'Content-Type: application/json' -d 'not json' \
            -w '%{http_code}' "http://127.0.0.1:8080/api/v1/tasks/new?title=x")
          # The same mapping, the other side. The body here is *valid*, so the deserializer did not fail —
          # the handler threw the DecodingError itself, which only the forwarder's copy can catch, and it
          # answers with the document's own 422 case.
          mappedDecodeInside=$(curl -s -o /dev/null -X POST -H 'Content-Type: application/json' \
            -d '{"id":"z","title":"t"}' -w '%{http_code}' \
            "http://127.0.0.1:8080/api/v1/tasks/new?title=corrupt")

          # Responses the shim constructs: a non-200 success inferred from the document, a no-content
          # response chosen by @ResponseStatus, and one chosen by @JSONResponse — the two annotations
          # splitting on whether the handler returns a body.
          # A required request body, decoded by the generator and handed to the handler as the schema
          # type: the response echoes the body's `id`, which only arrives if it was decoded.
          created=$(curl -s -X POST -H 'Content-Type: application/json' -d '{"id":"from-body","title":"x"}' \
            "http://127.0.0.1:8080/api/v1/tasks/new?title=hello" -w ' [%{http_code}]')
          # The generator rejects what it cannot decode by *throwing*; without the terminal mapping that
          # to a response the connection is dropped with no reply at all, which is what these catch.
          missingBody=$(curl -s -o /dev/null -X POST \
            "http://127.0.0.1:8080/api/v1/tasks/new?title=hello" -w '%{http_code}')
          wrongType=$(curl -s -o /dev/null -X POST -H 'Content-Type: text/plain' -d hi \
            "http://127.0.0.1:8080/api/v1/tasks/new?title=hello" -w '%{http_code}')
          deleted=$(curl -s -o /dev/null -X POST http://127.0.0.1:8080/api/v1/tasks/7/delete \
            -w '%{http_code}:%{size_download}')
          # Assertions the *document* makes that the generator drops. `getTask` puts a `pattern` on its
          # path parameter and maps the failure to its documented 422, so the answer is one of the
          # operation's own responses. `deleteTask` bounds its own with `maxLength` and maps nothing, so
          # the unmapped tier answers — 400, because the violation is in a parameter and not a body.
          # Both are generated: nothing in either controller checks anything by hand.
          assertMapped=$(curl -s -w ' [%{http_code}]' -H 'x-api-key: secret' \
            http://127.0.0.1:8080/api/v1/tasks/NOT-LOWERCASE)
          assertUnmapped=$(curl -s -w ' [%{http_code}]' -X POST \
            http://127.0.0.1:8080/api/v1/tasks/far-too-long-to-be-an-id/delete)
          # A *body* assertion, which answers 422 where the parameter ones above answer 400 — the split
          # `WireMVCBindingError` already draws, now reached from both sides. And `Task` is recursive, so
          # the second probe fails two levels down: a `$ref` is emitted as a call to the schema's own
          # validator, which is what terminates on a cycle and what makes the indexed path possible.
          assertBody=$(curl -s -w ' [%{http_code}]' -X POST -H 'Content-Type: application/json' \
            -d '{"id":"x","title":""}' "http://127.0.0.1:8080/api/v1/tasks/new?title=t")
          assertNested=$(curl -s -w ' [%{http_code}]' -X POST -H 'Content-Type: application/json' \
            -d '{"id":"x","title":"ok","subtasks":[{"id":"y","title":"fine"},{"id":"z","title":""}]}' \
            "http://127.0.0.1:8080/api/v1/tasks/new?title=t")
          # An *optional* body: the generated `Input.body` is optional exactly when the document does not
          # require one, so both presence and absence have to work.
          replaced=$(curl -s -X POST -H 'Content-Type: application/json' -d '{"id":"B9","title":"x"}' \
            "http://127.0.0.1:8080/api/v1/tasks/9/replace?title=renamed" -w ' [%{http_code}]')
          replacedBare=$(curl -s -X POST "http://127.0.0.1:8080/api/v1/tasks/9/replace?title=renamed" \
            -w ' [%{http_code}]')
          kill "$pid" 2>/dev/null || true
          [ "$ok" = 1 ] || { echo "the fixture did not bind"; cat serverlog.txt; exit 1; }
          # Foundation escapes `/` as `\/` in JSON output; strip the backslashes rather than write
          # patterns that `case` would itself treat as escapes.
          plain() { printf '%s' "$1" | tr -d '\\'; }
          echo "GET /api/v1/tasks/42 → $openapi"
          echo "GET /status/tasks    → $mvc"
          echo "GET /nope            → $notfound"
          echo "GET /tasks/42        → $unprefixed (expect 404: the prefix comes from servers:)"
          echo "GET /api/v2/orders/7 → $order"
          echo "GET /api/v1/orders/7 → $crossed (expect 404: that prefix belongs to the other document)"
          echo "GET /api/v2/orders   → $summary"
          echo "GET /api/v2/tasks    → $crossed2 (expect 404: likewise, in the other direction)"
          echo "GET .../summary      → $typed"
          case "$(plain "$openapi")" in
            *'"title":"task-42 via /api/v1/tasks/42"'*"[200]") ;;
            *) echo "the OpenAPI operation did not serve"; exit 1;;
          esac
          case "$mvc" in *'"count":3'*"[200]") ;; *) echo "the WireMVC route did not serve"; exit 1;; esac
          [ "$openapiServedBy" = wire-open-api ] || {
            echo "a global @Middleware's header did not reach the OpenAPI operation"; exit 1; }
          [ "$mvcServedBy" = wire-open-api ] || {
            echo "a global @Middleware's header did not reach the WireMVC route"; exit 1; }
          case "$notfound" in *"no route here"*"[404]") ;; *) echo "@NotFound did not fire"; exit 1;; esac
          [ "$unprefixed" = 404 ] || { echo "operation registered without its server prefix"; exit 1; }
          # Served by the *other* controller of the same spec, from the shared app-scoped TaskStore.
          case "$list" in *'"3"'*"[200]") ;; *) echo "the second controller's operation did not serve"; exit 1;; esac

          # @Scoped(seed:) — the M6d.3 gate. The subject is built from the request being served and
          # reaches the operation with no ambient state: each response must carry its own request's path,
          # and the scope must be entered once per request rather than shared.
          case "$(plain "$other")" in
            *'"title":"task-99 via /api/v1/tasks/99"'*"[200]") ;;
            *) echo "the request-scoped subject did not follow the request"; exit 1;;
          esac
          echo "=== scope log ==="; grep -E '^scope:' serverlog.txt || true
          grep -q '^scope: constructed for /api/v1/tasks/42' serverlog.txt \
            || { echo "the request scope was not entered for the first request"; exit 1; }
          grep -q '^scope: constructed for /api/v1/tasks/99' serverlog.txt \
            || { echo "the request scope was not re-entered for the second request"; exit 1; }

          # @Coding — the M6d.6 gate. Two separate properties, and the second is the one that bites.
          #
          # 1. Both kinds of route write the same instant the same way. Before this, a WireMVC @Get
          #    encoded with Foundation's default — a number of seconds since 2001 — while an operation
          #    next to it used the OpenAPI runtime's ISO8601. One app, two spellings of a date.
          # 2. The app's *declared* settings reached the generated code. Agreement alone does not show
          #    that: ISO8601 is now the default on both sides, so it would hold even if the value never
          #    travelled. Sorted keys is nobody's default — AppCoding asks for it, and only an operation
          #    whose Configuration was built from that value can produce it.
          echo "=== coding ==="
          echo "openapi → $(plain "$openapi")"
          echo "wiremvc → $mvc"
          case "$openapi" in *'"at":"2023-11-14T22:13:20Z"'*) ;;
            *) echo "the OpenAPI operation did not write the fixture date as ISO8601"; exit 1;; esac
          case "$mvc" in *'"at":"2023-11-14T22:13:20Z"'*) ;;
            *) echo "the WireMVC route did not write the same instant the same way"; exit 1;; esac
          case "$(plain "$openapi")" in '{"at":'*'"id":"42"'*'"title":'*) ;;
            *) echo "the app-wide sortsKeys did not reach the OpenAPI operation"; exit 1;; esac

          # The controller tier, resolved by a running app rather than asserted in rendered source.
          # EpochController overrides with a keyed binding that writes seconds; StatusController serves the
          # same TaskCount from the app tier. An override that leaked would fail the second case as surely
          # as one that never applied would fail the first.
          echo "epoch   → $epoch"
          case "$epoch" in *'"at":"1700000000"'*"[200]") ;;
            *) echo "the controller-scope @Coding override did not resolve"; exit 1;; esac
          case "$mvc" in *'"at":"2023-11-14T22:13:20Z"'*) ;;
            *) echo "a controller-scope @Coding override leaked to another controller"; exit 1;; esac

          # @Middleware — the M6d.2 gate. One RequireAPIKey component, declared once, folding around an
          # OpenAPI operation and an annotation-driven @Get alike; one Audit at route scope on a single
          # operation. Asserted from the log because a middleware that silently does not run still
          # produces a correct response — the failure this cannot be allowed to miss.
          echo "=== middleware log ==="; grep -E '^apikey:|^audit:' serverlog.txt || true
          grep -q '^apikey: GET /api/v1/tasks/42' serverlog.txt \
            || { echo "controller-scope @Middleware did not run on the OpenAPI operation"; exit 1; }
          grep -q '^apikey: GET /status/tasks' serverlog.txt \
            || { echo "the same @Middleware component did not run on the WireMVC route"; exit 1; }
          grep -q '^audit: /api/v1/tasks$' serverlog.txt \
            || { echo "route-scope @Middleware did not run on its operation"; exit 1; }
          # Route scope must not leak to the controller's other operations.
          grep -q '^audit: /api/v1/tasks/42' serverlog.txt \
            && { echo "route-scope @Middleware leaked onto another operation"; exit 1; } || true

          # Two controllers, one spec — the M6d.3 gate. Each keeps its own controller-scope fold and its
          # own scope: TaskController declares @Middleware(RequireAPIKey) and is @Scoped(seed:), while
          # TaskListController declares neither. A group that shared either would show it here.
          grep -q '^apikey: GET /api/v1/tasks$' serverlog.txt \
            && { echo "controller-scope @Middleware leaked between controllers sharing a spec"; exit 1; } || true
          grep -q '^scope: constructed for /api/v1/tasks$' serverlog.txt \
            && { echo "an app-scoped controller's operation entered a request scope"; exit 1; } || true

          # Two specs in one app. OrdersAPI is generated `public` into its own module, with its own
          # request scope and its own server prefix; the app also generates the Tasks document itself.
          # Both spell APIProtocol/Operations/Servers the same, so a mix-up would land here.
          case "$(plain "$order")" in
            *'"item":"item-7 via /api/v2/orders/7"'*"[200]") ;;
            *) echo "the second spec's operation did not serve"; exit 1;;
          esac
          case "$(plain "$order2")" in
            *'"item":"item-9 via /api/v2/orders/9"'*"[200]") ;;
            *) echo "the second spec's request-scoped subject did not follow the request"; exit 1;;
          esac
          [ "$crossed" = 404 ] || { echo "one document's prefix served the other's operation"; exit 1; }
          grep -q '^scope: order trace for /api/v2/orders/7' serverlog.txt \
            || { echo "the second spec's request scope was not entered"; exit 1; }
          # Middleware belongs to the controller that declared it, and nothing in OrdersAPI declares any.
          grep -q '^apikey: GET /api/v2/orders/7' serverlog.txt \
            && { echo "@Middleware leaked from one spec to another"; exit 1; } || true

          # One document, two controllers, two modules. OrderSummaryController is declared in this target
          # and implements the OrdersAPI document, which is the case `spec:` cannot be derived for.
          case "$summary" in
            *'"item-7"'*'"item-9"'*"[200]") ;;
            *) echo "the cross-module controller's operation did not serve"; exit 1;;
          esac
          [ "$crossed2" = 404 ] || { echo "one document's prefix served the other's operation"; exit 1; }
          # `@Operation` — the typed shim. `id` comes from the path, `include-done` from the query and
          # `X-Request-Id` from a header, each read from the `Input` member the *document* places it in,
          # under member names only the safe-name transform produces (`includeDone`, `xRequestId`). A
          # binding that read the wrong location, or spelled a member by convention, would serve a
          # default here rather than fail.
          case "$typed" in
            *'"title":"summary of task-9 done=true req=abc123"'*"[200]") ;;
            *) echo "the typed operation did not bind its parameters"; exit 1;;
          esac
          # Absent optionals stay absent rather than becoming empty strings.
          case "$typedBare" in
            *'"title":"summary of task-9 done=false req=-"'*"[200]") ;;
            *) echo "the typed operation mishandled absent optional parameters"; exit 1;;
          esac

          # The response side. A status is chosen from the document, not defaulted to 200: `createTask`
          # documents only 201, so `.created` is inferred; `replaceTask` documents 200 and 201, so the
          # handler names one. `deleteTask` documents 202 and 204, both content-free, so its Void handler
          # names one with @ResponseStatus — and must still run, which the log line is the evidence for.
          case "$(plain "$created")" in
            *'"id":"from-body"'*'"title":"hello"'*"[201]") ;;
            *) echo "the required request body was not decoded into the handler"; exit 1;;
          esac
          [ "$missingBody" = 400 ] \
            || { echo "a missing required body did not answer 400 ($missingBody)"; exit 1; }
          [ "$wrongType" = 415 ] \
            || { echo "a wrong content type did not answer 415 ($wrongType)"; exit 1; }
          [ "$deleted" = "204:0" ] || { echo "the no-content response was not constructed ($deleted)"; exit 1; }
          # The mapped tier answers as the document describes; the unmapped one names the failure so a
          # caller can act on it. Asserting the *body* of each, not just the status: a 422 that carried
          # the wrong thing, or a 400 that named no field, would pass a status-only check.
          case "$(plain "$assertMapped")" in
            *'"message":"invalid: path.id"'*"[422]") ;;
            *) echo "a schema violation was not mapped to the document's response ($assertMapped)"; exit 1;;
          esac
          case "$(plain "$assertUnmapped")" in
            *'"keyword":"maxLength"'*'"path":"path.id"'*"[400]") ;;
            *) echo "an unmapped schema violation did not answer 400 with its failures ($assertUnmapped)"; exit 1;;
          esac
          case "$(plain "$assertBody")" in
            *'"path":"body.title"'*"[422]") ;;
            *) echo "a body violation did not answer 422 ($assertBody)"; exit 1;;
          esac
          case "$(plain "$assertNested")" in
            *'"path":"body.subtasks[1].title"'*"[422]") ;;
            *) echo "a violation inside a recursive schema was not found or not named ($assertNested)"; exit 1;;
          esac
          grep -q '^deleted: 7' serverlog.txt \
            || { echo "a no-content handler was not called"; exit 1; }
          case "$(plain "$replaced")" in
            *'"title":"renamed from B9"'*"[201]") ;;
            *) echo "@JSONResponse(status:) or the optional body failed"; exit 1;;
          esac
          case "$(plain "$replacedBare")" in
            *'"title":"renamed from nothing"'*"[201]") ;;
            *) echo "an absent optional body was not handled"; exit 1;;
          esac

          # A thrown error becomes a response the *document* describes, serialised by the generator like
          # any success — and route-scope mappings fold inside controller-scope ones, so 404 here rather
          # than the controller's 500 for the same error type.
          case "$mappedDocumented" in
            *"[404]") ;;
            *) echo "@ErrorResponse route scope did not win ($mappedDocumented)"; exit 1;;
          esac
          [ "$mappedUndocumented" = 403 ] \
            || { echo "@ErrorResponse route-scope mapping failed ($mappedUndocumented)"; exit 1; }
          [ "$mappedController" = 500 ] \
            || { echo "@ErrorResponse controller-scope mapping failed ($mappedController)"; exit 1; }
          [ "$mappedDecode" = 422 ] \
            || { echo "@ErrorResponse(DecodingError.self) at the terminal failed ($mappedDecode)"; exit 1; }
          [ "$mappedDecodeInside" = 422 ] \
            || { echo "@ErrorResponse(DecodingError.self) in the forwarder failed ($mappedDecodeInside)"; exit 1; }
          # The three-argument form: 404 declares a Problem, so the mapping supplies one and the generator
          # serialises it as that response's body.
          case "$(plain "$mappedDocumented")" in
            *'"message":"no such task"'*) ;;
            *) echo "the body-returning @ErrorResponse form did not produce its body"; exit 1;;
          esac

          # It is app-scoped, so it enters no request scope even though its sibling in OrdersAPI does.
          grep -q '^scope: order trace for /api/v2/orders$' serverlog.txt \
            && { echo "an app-scoped controller's operation entered a request scope"; exit 1; } || true

  SwiftFormat:
    name: swift-format (6.4 toolchain)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Read the pinned toolchain
        # `.swift-version` is the single source of truth: local `swiftly` and CI resolve the same snapshot.
        # Bump the file, not the workflow.
        run: echo "SWIFT_SNAPSHOT=$(cat .swift-version)" >> "$GITHUB_ENV"
      - name: Install system dependencies
        # libcurl4-openssl-dev is required by the toolchain itself (Foundation networking on Linux) and must
        # precede the install, or Swiftly's post-install check fails.
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libsqlite3-dev libcurl4-openssl-dev curl
      - name: Install Swiftly + the pinned toolchain
        run: |
          curl -L "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz" | tar zxf -
          ./swiftly init --assume-yes --skip-install
          echo "$HOME/.local/share/swiftly/bin" >> "$GITHUB_PATH"
          # No `--use`: every command runs through `swiftly run`, which reads `.swift-version` itself.
          # `--use` would rewrite that file (dropping its trailing newline) and dirty the tree, which the
          # swift-format job's `git diff --exit-code` guard then fails on.
          "$HOME/.local/share/swiftly/bin/swiftly" install "$SWIFT_SNAPSHOT" --assume-yes
      - name: Run swift-format
        # From the 6.4 toolchain so it parses the proposal's ~Copyable / consuming sending syntax that
        # WireOpenAPIMVC's bridge carries (a released swift-format can't).
        run: swiftly run swift-format format --recursive --in-place .
      - name: Check for formatting differences
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code

  SwiftLint:
    name: SwiftLint 0.63.2
    # `swiftlint lint` is SwiftSyntax-based and parses the 6.4 sources fine, so it needs no toolchain.
    # The `unused_import` *analyzer* rule is dropped: it drives SourceKit against the compiler build log,
    # whose 6.4-only flags this SwiftLint's SourceKit rejects — on 6.4 the compiler's own
    # InternalImportsByDefault emits unused-import warnings natively instead.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install SwiftLint
        run: |
          curl -sL https://github.com/realm/SwiftLint/releases/download/0.63.2/swiftlint_linux_amd64.zip -o swiftlint.zip
          unzip -o swiftlint.zip -d /usr/local/bin
          chmod +x /usr/local/bin/swiftlint
      - name: SwiftLint
        run: swiftlint lint --quiet
