openapi: 3.1.0
info:
  title: Orders
  version: 1.0.0
# A different prefix from the Tasks document, so the two cannot be confused by the path alone.
servers:
  - url: /api/v2
paths:
  /orders/{id}:
    get:
      operationId: getOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: An order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
  /orders:
    get:
      operationId: listOrders
      responses:
        '200':
          description: Order ids
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
components:
  schemas:
    Order:
      type: object
      required: [id, item]
      properties:
        id:
          type: string
        item:
          type: string
          # Checked on the way *out*, because this document turns response validation on. A handler
          # returning something longer has broken its own contract: that is a 500, and not the caller's
          # problem to hear about.
          maxLength: 60
        # Recursive by $ref, and deliberately so: this is ordinary OpenAPI, swift-openapi-generator
        # supports it outright (it detects the cycle and boxes the type), and it used to fail this
        # adapter's document loading with "a reference that could not be resolved" — because
        # `locallyDereferenced()` resolves schema references too, and a cycle cannot be resolved that
        # way. Nothing in the codegen reads schemas, so references are now followed one hop at a time
        # only where they are read. Keeping a recursive schema here means a regression fails the build.
        relatedOrders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
