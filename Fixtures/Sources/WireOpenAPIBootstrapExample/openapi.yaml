openapi: 3.1.0
info:
  title: Tasks
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /tasks/{id}:
    get:
      operationId: getTask
      parameters:
        - name: id
          in: path
          required: true
          # An assertion the generator drops: it emits `Swift.String` and enforces nothing. The generated
          # validator checks it before the handler runs, and this operation maps the failure to its
          # documented 422 below.
          schema:
            type: string
            pattern: '^[a-z0-9-]+$'
      responses:
        '200':
          description: A task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        # Declared so a schema-validation rejection has a documented response to be answered with.
        # It carries a body, which is what makes the mapping on `getTask` use the closure form — the
        # document picks the form, here as everywhere.
        '422':
          description: The request does not satisfy the document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
  /tasks/{id}/authorized:
    get:
      operationId: authorizedTask
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: A task the caller may read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        # The refusal is the *binding's*, thrown before the handler runs — but it is still one of this
        # operation's own responses, which is what lets `@ErrorResponse` answer it as the document
        # describes rather than as an undocumented status.
        '403':
          description: The caller may not read this task
  /tasks:
    get:
      operationId: listTasks
      responses:
        '500': { description: Failed }
        '200':
          description: Task ids
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /tasks/{id}/summary:
    get:
      operationId: summariseTask
      parameters:
        # Declared by reference, not inline. Ordinary OpenAPI, and the shape that exposed reading the
        # document as a dictionary: a `$ref` carries no `name`, so it was dropped and a handler binding
        # `id` was rejected for binding something "the document does not declare". OpenAPIKit resolves it.
        - { $ref: '#/components/parameters/TaskId' }
        - { name: include-done, in: query, required: false, schema: { type: boolean } }
        - { name: X-Request-Id, in: header, required: false, schema: { type: string } }
      responses:
        '200':
          description: A task summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: No such task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403': { description: Not allowed }
  /tasks/new:
    post:
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Task' }
      parameters:
        - { name: title, in: query, required: true, schema: { type: string } }
      responses:
        '500': { description: Failed }
        # Declared so the DecodingError mapping has a documented case to construct *inside* the
        # forwarder. Without it the mapping still answers, from the terminal — the difference is only
        # which side of the generator the response is built on.
        # Now carries a body: one @ErrorResponse on the validation error answers both a body the
        # deserializer refused and one a generated check refused, so the response has to be able to say
        # which field was at fault.
        '422':
          description: The request does not satisfy the document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
  /tasks/{id}/delete:
    post:
      operationId: deleteTask
      # No mapping covers a validation failure here, so the unmapped tier answers it — 400, because the
      # violation is in a *parameter* rather than a body. The bound is an upper one so that every id the
      # rest of the fixture already deletes stays valid: a new assertion should demonstrate itself
      # without rewriting the assertions around it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, maxLength: 8 } }
      responses:
        '500': { description: Failed }
        '202': { description: Accepted }
        '204': { description: Deleted }
  /tasks/{id}/replace:
    post:
      operationId: replaceTask
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Task' }
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: title, in: query, required: true, schema: { type: string } }
      responses:
        '500': { description: Failed }
        '200':
          description: Replaced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
components:
  parameters:
    TaskId: { name: id, in: path, required: true, schema: { type: string } }
  schemas:
    Problem:
      type: object
      required: [message]
      properties:
        message: { type: string }
    Task:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
        title:
          type: string
          # A *body* assertion, where the parameter ones above are request-line. Unmapped it answers 422
          # rather than 400 — the split `WireMVCBindingError` already draws, now reached from both sides.
          minLength: 1
          maxLength: 40
        # Recursive, and constrained, so the generated validator for `Task` calls itself. That is the
        # shape slice 3 exists for: a `$ref` becomes a call rather than an expansion, which is what
        # terminates here and keeps the emitted code linear in the document. Keeping it in the fixture
        # means a regression fails the build rather than hanging it.
        subtasks:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/Task'
        # Not required, so existing constructions still compile — but enough to prove an OpenAPI
        # operation and a `@Get` route now write a date the same way.
        at:
          type: string
          format: date-time
