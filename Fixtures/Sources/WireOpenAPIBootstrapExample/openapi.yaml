openapi: 3.1.0
info:
  title: Tasks
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /tasks/{id}:
    get:
      operationId: getTask
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
components:
  schemas:
    Task:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
        title:
          type: string
