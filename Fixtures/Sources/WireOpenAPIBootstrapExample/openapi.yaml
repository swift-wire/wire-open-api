openapi: 3.1.0
info:
  title: Tasks
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /tasks/{id}:
    get:
      operationId: getTask
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
  /tasks:
    get:
      operationId: listTasks
      responses:
        '200':
          description: Task ids
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /tasks/{id}/summary:
    get:
      operationId: summariseTask
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: include-done, in: query, required: false, schema: { type: boolean } }
        - { name: X-Request-Id, in: header, required: false, schema: { type: string } }
      responses:
        '200':
          description: A task summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
  /tasks/new:
    post:
      operationId: createTask
      parameters:
        - { name: title, in: query, required: true, schema: { type: string } }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
  /tasks/{id}/delete:
    post:
      operationId: deleteTask
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '202': { description: Accepted }
        '204': { description: Deleted }
  /tasks/{id}/replace:
    post:
      operationId: replaceTask
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: title, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
components:
  schemas:
    Task:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
        title:
          type: string
